<VirtualHost *:80>
    ServerName simada.local
    ServerAdmin admin@localhost
    DocumentRoot /var/www/simada

    <Directory /var/www/simada>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/simada/config>
        Require all denied
    </Directory>

    <Directory /var/www/simada/database>
        Require all denied
    </Directory>

    <Directory /var/www/simada/deploy>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/simada_error.log
    CustomLog ${APACHE_LOG_DIR}/simada_access.log combined
</VirtualHost>
